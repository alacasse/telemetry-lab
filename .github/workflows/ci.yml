name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.6"
  UV_PYTHON: "3.12"
  AWS_EC2_METADATA_DISABLED: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Python quality and browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: uv sync --frozen --group dev --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy .
      # Service-backed tests run below with disposable services; cloud-only tests
      # remain skipped because this workflow has no cloud credentials.
      - run: uv run --frozen pytest -ra
      - run: node --test tests/ui/demo.test.cjs tests/ui/thermal.test.cjs tests/ui/thermostat.test.cjs tests/ui/thermostat-flow.test.cjs

  integration:
    name: Disposable PostgreSQL, queue and thermostat
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen --group dev --python 3.12
      - run: PYTHON=.venv/bin/python sh scripts/test-postgres.sh
      - run: PYTHON=.venv/bin/python sh scripts/test-thermal-command-migration.sh
      - run: sh scripts/demo-local.sh --test-thermostat --startup-order runtime-first --port 8089
      - run: sh scripts/demo-local.sh --test --port 8090

  bundles:
    name: Linux x86_64 Python 3.12 Lambda bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build all four bundles in the SAM build image
        run: |
          # Compute provenance from the checked-out tree, including PR merge refs.
          # Do not inherit CI_COMMIT_SHA/GITHUB_SHA overrides inside the container.
          revision=$(git rev-parse HEAD)
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src" -w /src \
            -e SOURCE_VERSION="$revision" -e UV_VERSION \
            -e UV_PROJECT_ENVIRONMENT=/tmp/lambda-build-venv \
            --entrypoint /bin/bash public.ecr.aws/sam/build-python3.12:latest \
            -euo pipefail -c '
              git config --global --add safe.directory /src
              python3.12 -m pip install "uv==$UV_VERSION"
              uv sync --frozen --group dev --python 3.12
              uv run --frozen python scripts/package-lambdas.py --runtime python3.12 --architecture x86_64
            '
      - name: Verify every checksum and isolated handler import without network
        run: |
          docker run --rm --platform linux/amd64 --network none \
            -v "$PWD:/src:ro" -w /tmp \
            --entrypoint /var/lang/bin/python3.12 public.ecr.aws/lambda/python:3.12 \
            -I -S /src/scripts/verify-lambda-bundles.py /src/dist/lambdas

  terraform:
    name: Terraform formatting and configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/install-terraform.py --version 1.8.5 --install-dir .local/bin
      - name: Validate both configurations using committed provider locks
        run: |
          .local/bin/terraform -chdir=infrastructure/bootstrap fmt -check -recursive
          .local/bin/terraform -chdir=infrastructure/staging fmt -check -recursive
          .local/bin/terraform -chdir=infrastructure/bootstrap init -backend=false -lockfile=readonly
          .local/bin/terraform -chdir=infrastructure/bootstrap validate
          .local/bin/terraform -chdir=infrastructure/staging init -backend=false -lockfile=readonly
          .local/bin/terraform -chdir=infrastructure/staging validate
